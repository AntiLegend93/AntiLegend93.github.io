<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AntiLegend93 Apps</title>
<meta name="description" content="Free Windows apps by AntiLegend93: AudioLink, DiagPortal and more.">
<link rel="icon" href="images/audiolink-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">

<!-- Visitor tracking (Umami): dashboard at https://cloud.umami.is -->
<script defer src="https://cloud.umami.is/script.js" data-website-id="dd959b6c-3943-4010-b573-590cead3c529"></script>

<style>
  :root {
    --rack: #10151d;        /* the cabinet behind the panels */
    --panel: #1c222c;       /* each app's faceplate */
    --panel-edge: #2a313d;
    --ear: #161b23;         /* the side mounting strips */
    --text: #e8ecf2;
    --muted: #8a93a3;
    --cyan: #4fc3f7;        /* AudioLink's readout colour */
    --green: #2fbf71;       /* AudioLink's ON colour */
    --readout: #070b10;
    --pink: #ff6b9d;
    --focus: #ffd166;
  }

  * { box-sizing: border-box; }

  html { background: var(--rack); }

  body {
    margin: 0;
    background:
      repeating-linear-gradient(0deg, transparent 0 3px, rgba(255,255,255,.012) 3px 4px),
      var(--rack);
    color: var(--text);
    font: 400 17px/1.6 "IBM Plex Sans", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  a { color: inherit; }

  :focus-visible { outline: 2px solid var(--focus); outline-offset: 3px; border-radius: 4px; }

  .wrap { width: min(1080px, 100% - 32px); margin-inline: auto; }

  /* ---------- Header ---------- */

  header { padding: 72px 0 40px; }

  .handle {
    font: 600 15px/1 "Chakra Petch", sans-serif;
    color: var(--cyan);
    letter-spacing: .04em;
    margin: 0 0 18px;
  }

  h1 {
    font: 700 clamp(40px, 6.4vw, 72px)/1.02 "Chakra Petch", sans-serif;
    letter-spacing: -.01em;
    margin: 0;
    max-width: 16ch;
  }

  .intro {
    color: var(--muted);
    max-width: 52ch;
    margin: 20px 0 0;
    font-size: 18px;
  }

  .total {
    margin-top: 28px;
    display: inline-flex;
    align-items: center;
    gap: 12px;
    color: var(--muted);
    font-size: 15px;
  }

  /* ---------- Rack units (one per app) ---------- */

  main { display: grid; gap: 18px; padding-bottom: 64px; }

  .unit {
    position: relative;
    display: grid;
    grid-template-columns: 34px 1fr 34px;
    background: var(--panel);
    border: 1px solid var(--panel-edge);
    border-radius: 6px;
    box-shadow: inset 0 1px 0 rgba(255,255,255,.04), 0 12px 30px rgba(0,0,0,.35);
  }

  /* Mounting ears with two screws each, like gear in a studio rack. */
  .ear {
    background: var(--ear);
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    align-items: center;
    padding: 18px 0;
  }
  .ear:first-child { border-right: 1px solid var(--panel-edge); border-radius: 6px 0 0 6px; }
  .ear:last-child { border-left: 1px solid var(--panel-edge); border-radius: 0 6px 6px 0; }
  .ear i {
    width: 12px; height: 12px; border-radius: 50%;
    background:
      linear-gradient(135deg, transparent 45%, #0c1016 45% 55%, transparent 55%),
      radial-gradient(circle at 35% 35%, #4a5261, #252b35 70%);
    box-shadow: inset 0 0 0 1px #0c1016;
  }

  .face {
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 28px 40px;
    padding: 30px 32px;
  }

  .ident { display: flex; gap: 20px; align-items: flex-start; }

  .icon {
    width: 64px; height: 64px; flex: none;
    border-radius: 14px;
    background: #0d1117;
    display: grid; place-items: center;
    font: 700 26px/1 "Chakra Petch", sans-serif; color: var(--cyan);
    overflow: hidden;
  }
  .icon img { width: 100%; height: 100%; object-fit: cover; }

  h2 {
    font: 700 30px/1.1 "Chakra Petch", sans-serif;
    margin: 4px 0 6px;
  }

  .tagline { margin: 0; color: var(--muted); max-width: 48ch; }

  .features {
    list-style: none;
    padding: 0;
    margin: 22px 0 0;
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 10px 28px;
    grid-column: 1 / -1;
  }
  .features li { position: relative; padding-left: 20px; font-size: 15.5px; }
  .features li::before {
    content: "";
    position: absolute; left: 0; top: .62em;
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--green);
    box-shadow: 0 0 6px rgba(47,191,113,.6);
  }

  .left { min-width: 0; }

  /* ---------- Download side ---------- */

  .controls {
    display: flex;
    flex-direction: column;
    align-items: stretch;
    gap: 12px;
    min-width: 240px;
  }

  .readout {
    background: var(--readout);
    border: 1px solid #000;
    border-radius: 4px;
    box-shadow: inset 0 2px 8px rgba(0,0,0,.8);
    padding: 12px 16px 10px;
    text-align: right;
  }
  .digits {
    font: 600 40px/1 "Chakra Petch", sans-serif;
    font-variant-numeric: tabular-nums;
    color: var(--cyan);
    text-shadow: 0 0 10px rgba(79,195,247,.45);
    letter-spacing: .06em;
  }
  .digits .off { color: #13202b; text-shadow: none; }
  .readout small { display: block; color: var(--muted); font-size: 13px; margin-top: 6px; }

  .download {
    display: block;
    text-align: center;
    text-decoration: none;
    font: 700 16px/1 "Chakra Petch", sans-serif;
    letter-spacing: .03em;
    color: #06150d;
    background: var(--green);
    padding: 15px 18px;
    border-radius: 4px;
    box-shadow: 0 0 0 1px rgba(0,0,0,.4), 0 6px 18px rgba(47,191,113,.25);
  }
  .download:hover { filter: brightness(1.08); }
  .download:active { transform: translateY(1px); }

  .meta { display: flex; justify-content: space-between; font-size: 14px; color: var(--muted); }
  .meta a { text-decoration: underline; text-underline-offset: 3px; }
  .meta a:hover { color: var(--text); }

  .shot {
    grid-column: 1 / -1;
    margin: 4px 0 0;
    border-radius: 6px;
    overflow: hidden;
    border: 1px solid var(--panel-edge);
    background: #0d1117;
  }
  .shot img { display: block; width: 100%; height: auto; }

  /* ---------- Footer ---------- */

  footer {
    border-top: 1px solid var(--panel-edge);
    padding: 36px 0 56px;
    color: var(--muted);
    display: flex;
    flex-wrap: wrap;
    gap: 16px 32px;
    align-items: center;
    justify-content: space-between;
  }
  footer p { margin: 0; max-width: 46ch; }
  .donate {
    text-decoration: none;
    font: 700 15px/1 "Chakra Petch", sans-serif;
    color: var(--pink);
    border: 1px solid var(--pink);
    padding: 12px 18px;
    border-radius: 4px;
  }
  .donate:hover { background: rgba(255,107,157,.1); }

  /* ---------- Small screens ---------- */

  @media (max-width: 760px) {
    header { padding: 48px 0 28px; }
    .unit { grid-template-columns: 16px 1fr 16px; }
    .ear { padding: 12px 0; }
    .ear i { width: 8px; height: 8px; }
    .face { grid-template-columns: 1fr; padding: 22px 18px; }
    .controls { min-width: 0; }
    .features { grid-template-columns: 1fr; }
    .ident { gap: 14px; }
    .icon { width: 52px; height: 52px; border-radius: 12px; }
    h2 { font-size: 26px; }
  }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; animation: none !important; }
  }
</style>
</head>
<body>

<header class="wrap">
  <p class="handle">AntiLegend93</p>
  <h1>Free apps for your Windows PC</h1>
  <p class="intro">Small, focused tools I build and give away. No ads, no accounts. Download, run, done.</p>
  <p class="total" id="total" hidden></p>
</header>

<main class="wrap" id="apps"></main>

<footer class="wrap">
  <p>Everything here is free. If an app saved you some hassle, a donation keeps new ones coming.</p>
  <a class="donate" href="https://venmo.com/code?user_id=3587678062773330218&created=1791519560"
     target="_blank" rel="noopener" data-umami-event="Donate">♥ Donate with Venmo</a>
</footer>

<script>
/*
  YOUR APPS: edit this list to add, remove or change apps. Each one becomes a panel on the page.
    repo        Your GitHub repository ("owner/name"). Download counts and the latest version come from its Releases.
    icon        Picture next to the name (optional). Put it in the images folder.
    screenshot  Big picture under the panel (optional). Leave it out, or leave the file missing, and it's simply hidden.
    file        Which release file the Download button gets. Anything ending in this, e.g. "Setup" matches
                "AudioLink-Setup-1.1.3.exe". If no file matches, the button opens the release page instead.
*/
const APPS = [
  {
    name: "AudioLink",
    repo: "AntiLegend93/AudioLink",
    icon: "images/audiolink-icon.png",
    screenshot: "images/audiolink-screenshot.png",
    file: "Setup",
    tagline: "Play your PC's sound through all your speakers and monitors at once, perfectly in sync.",
    features: [
      "Speakers, monitor speakers, headphones and Bluetooth, all at once",
      "Perfect Sync lines every device up so nothing echoes",
      "A real mixer: volume, meters, delay, bass and treble per device",
      "Choose which app plays on which device",
      "Profiles for movies, gaming or headphones",
      "Runs in the tray and keeps itself up to date",
    ],
  },
  {
    name: "DiagPortal",
    repo: "AntiLegend93/diagportal-updates",
    icon: "images/diagportal-icon.png",
    screenshot: "images/diagportal-screenshot.png",
    file: ".exe",
    tagline: "Check your whole PC in one click and read the results in clear, dark-mode reports.",
    features: [
      "85 system checks run in one go",
      "Readable reports right inside the app",
      "Hardware, drivers, network, security and more",
      "Updates itself when a new version is out",
    ],
  },
];

const CACHE_MINUTES = 30; // GitHub allows about 60 lookups an hour per visitor, so counts are remembered briefly

const escapeHtml = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

function digitsHtml(n, width = 6) {
  const text = String(n);
  const pad = Math.max(0, width - text.length);
  return `<span class="off">${"0".repeat(pad)}</span>${text}`;
}

function panelHtml(app, i) {
  const initial = escapeHtml(app.name[0]);
  const icon = app.icon
    ? `<img src="${escapeHtml(app.icon)}" alt="" onerror="this.replaceWith(document.createTextNode('${initial}'))">`
    : initial;
  const shot = app.screenshot
    ? `<figure class="shot"><img src="${escapeHtml(app.screenshot)}" alt="${escapeHtml(app.name)} screenshot" loading="lazy" onerror="this.closest('figure').remove()"></figure>`
    : "";
  const releases = `https://github.com/${app.repo}/releases`;
  return `
  <article class="unit" aria-labelledby="app-${i}">
    <div class="ear" aria-hidden="true"><i></i><i></i></div>
    <div class="face">
      <div class="left">
        <div class="ident">
          <div class="icon">${icon}</div>
          <div>
            <h2 id="app-${i}">${escapeHtml(app.name)}</h2>
            <p class="tagline">${escapeHtml(app.tagline)}</p>
          </div>
        </div>
        <ul class="features">${app.features.map(f => `<li>${escapeHtml(f)}</li>`).join("")}</ul>
      </div>
      <div class="controls">
        <div class="readout" aria-live="polite">
          <div class="digits" data-count>${digitsHtml("")}</div>
          <small data-count-label>downloads</small>
        </div>
        <a class="download" data-download href="${releases}/latest" data-umami-event="Download ${escapeHtml(app.name)}">Download for Windows</a>
        <div class="meta">
          <span data-version>Latest version</span>
          <a href="https://github.com/${app.repo}" target="_blank" rel="noopener">View on GitHub</a>
        </div>
      </div>
      ${shot}
    </div>
    <div class="ear" aria-hidden="true"><i></i><i></i></div>
  </article>`;
}

/* Download totals and the newest version, from GitHub's public Releases API. */
async function releaseInfo(app) {
  const key = "rel:" + app.repo;
  try {
    const cached = JSON.parse(localStorage.getItem(key) || "null");
    if (cached && Date.now() - cached.at < CACHE_MINUTES * 60000) return cached.info;
  } catch (e) { /* no storage: just ask GitHub */ }

  const res = await fetch(`https://api.github.com/repos/${app.repo}/releases?per_page=100`);
  if (!res.ok) throw new Error("GitHub said " + res.status);
  const releases = (await res.json()).filter(r => !r.draft);
  const downloads = releases.reduce((sum, r) => sum + r.assets.reduce((s, a) => s + a.download_count, 0), 0);
  const latest = releases.find(r => !r.prerelease) || releases[0];
  const asset = latest && latest.assets.find(a => a.name.toLowerCase().includes(String(app.file || ".exe").toLowerCase()));
  const info = {
    downloads,
    version: latest ? latest.tag_name : null,
    url: asset ? asset.browser_download_url : null,
  };
  try { localStorage.setItem(key, JSON.stringify({ at: Date.now(), info })); } catch (e) {}
  return info;
}

/* The one bit of motion: counters roll up to their number when the page loads. */
function rollTo(el, target) {
  const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  if (reduce || target === 0) { el.innerHTML = digitsHtml(target); return; }
  const start = performance.now(), duration = 1200;
  const step = now => {
    const t = Math.min(1, (now - start) / duration);
    const eased = 1 - Math.pow(1 - t, 3);
    el.innerHTML = digitsHtml(Math.round(target * eased));
    if (t < 1) requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
}

async function main() {
  const list = document.getElementById("apps");
  list.innerHTML = APPS.map(panelHtml).join("");
  const panels = [...list.querySelectorAll(".unit")];

  let total = 0, known = 0;
  await Promise.all(APPS.map(async (app, i) => {
    const panel = panels[i];
    try {
      const info = await releaseInfo(app);
      rollTo(panel.querySelector("[data-count]"), info.downloads);
      panel.querySelector("[data-count-label]").textContent = info.downloads === 1 ? "download" : "downloads";
      if (info.version) panel.querySelector("[data-version]").textContent = "Version " + info.version.replace(/^v/i, "");
      if (info.url) panel.querySelector("[data-download]").href = info.url;
      total += info.downloads;
      known++;
    } catch (e) {
      panel.querySelector("[data-count]").innerHTML = '<span class="off">------</span>';
      panel.querySelector("[data-count-label]").textContent = "download count unavailable right now";
    }
  }));

  if (known > 0) {
    const el = document.getElementById("total");
    el.textContent = `${total.toLocaleString()} downloads across ${APPS.length} apps so far.`;
    el.hidden = false;
  }
}

main();
</script>
</body>
</html>
